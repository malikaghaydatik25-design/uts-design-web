<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Dark Split Screen</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="card">
        <article class="artwork-col">
            <img src="image/fower.png" alt="Artwork Ilustrasi" class="artwork-img">
        </article>

        <section class="form-col">
            <header>
                <h2>⭐</h2>
            </header>

            <form action="#" method="POST">

                <button type="button" class="btn-sso">
                    <img src="image/google-logo-removebg-preview.png" alt="Google Logo">
                    <span>Sign in with Google</span>
                </button>

                <div class="divider">
                    <span>Or</span>
                </div>

                <div class="input-group">
                    <input type="text" name="username" placeholder="Email / Username" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </section>
    </main>
</body>
</html>
