<!-- <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Background Blur (Glassmorphism)</title>
    <style>
        body {
            background-image: url('background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        /* Kartu dengan efek kaca buram (Glassmorphism) */
        article {
            background-color: rgba(255, 255, 255, 0.5);

            /* Menerapkan efek blur 10px pada latar di balik elemen */
            backdrop-filter: blur(10px);

            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <article>
        <h2>Artikel dengan Efek Background Blur</h2>
        <p>Properti backdrop-filter: blur(10px) memberikan efek buram pada latar belakang di balik komponen article, menciptakan tampilan visual menyerupai kaca (glassmorphism) yang modern.</p>
    </article>
</body>
</html> -->
