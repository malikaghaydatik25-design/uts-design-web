<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Implementasi Hyperlink</title>
</head>
<body>
    <h2>Contoh Implementasi Hyperlink</h2>

    <!-- Link Eksternal -->
        <p>Link Eksternal: <a href='https://www.google.com'target='_blank' title='Buka Google'>Kunjungi Google</a></P>

    <!-- Link Internal -->
        <p>Link Internal: <a href='tentang.html'>Halaman Tentang</a></p>

    <!-- Anchor Link -->
        <p>Anchor Link: <a href='#target-section'>Menuju Bagian Target</a></p>

    <!-- Link Komunikasi -->
        <p>Link Email: <a href='mailto:info@aranastudio.com'>Hubungi Kami</a></p>

    <!-- Link Unduhan -->
        <p>Link Unduhan: <a href='dokumen.pdf' download>Unduh Panduan PDF</a></p>

    <!-- Gambar sebagai Link -->
        <p>Gambar sebagai Link:</p> <a href='https://aranainc.com'><img src='logo.png' alt='Logo Arana' width='100'></a>

        <div id='target-section' style='margin-top: 500px;'>
            <h3>Bagian Target (Anchor)</h3>
            <p>Anda telah sampai di bagian target.</p>
            
        </div>
    </body>
</html>
