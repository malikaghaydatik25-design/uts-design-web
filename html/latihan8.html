<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Implementasi Gambar di HTML</title>
</head>
<body>
    <h2>Integrasi Visual</h2>

    <!-- Penggunaan Dasar -->
    <p>Gambar Dasar: <img src='photo/20211125DRA14.jpg' alt='Pemandangan Alam' width='300'></p>
    
    <!-- Penggunaan Figure & Caption -->
    <figure>
        <img src="photo/sejarah-candi-borobudur-lokasi-perayaan-hari-raya-waisak-2023-1_169.jpeg" alt='Candi Borobudur' width='400'>
        <figcaption>Fig1. Pemandangan Candi Borobudur saat matahari terbenam.</figcaption>
    </figure>

    <!-- Gambar sebagai Link -->
    <p>Gambar sebagai Tautan:</p> 
    <a href='https://share.google/KoKVJs4aOLDp0rFPl'>
        <img src='photo/Candi-Borobudur-Makna-Yang-Terkandung-di-Dalamnya.jpg' alt='Logo Situs' width='100'>
    </a>

</body>
</html>
